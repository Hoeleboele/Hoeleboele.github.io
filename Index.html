<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hoeleboele | App Hub</title>
	<meta name="description" content="A central place for Hoeleboele apps and tools.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-top: #eff6ff;
			--bg-bottom: #d6f0ef;
			--ink: #112a36;
			--muted: #365766;
			--card: rgba(255, 255, 255, 0.82);
			--line: rgba(17, 42, 54, 0.14);
			--brand-a: #ff8a5b;
			--brand-b: #2fbdaf;
			--brand-c: #3c7cff;
			--shadow: 0 14px 32px rgba(16, 34, 45, 0.12);
			--radius: 20px;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			min-height: 100%;
		}

		body {
			font-family: "Space Grotesk", "Segoe UI", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(55vw 55vw at 10% 18%, rgba(255, 138, 91, 0.24), transparent 60%),
				radial-gradient(48vw 48vw at 92% 78%, rgba(60, 124, 255, 0.18), transparent 62%),
				linear-gradient(165deg, var(--bg-top), var(--bg-bottom));
			overflow-x: hidden;
		}

		.noise-layer {
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: 0.3;
			background-image: radial-gradient(rgba(16, 34, 45, 0.07) 0.7px, transparent 0.7px);
			background-size: 11px 11px;
			z-index: -1;
		}

		.page {
			width: min(1100px, calc(100% - 2.2rem));
			margin: 0 auto;
			padding: 2rem 0 2.8rem;
		}

		.hero {
			display: grid;
			grid-template-columns: 120px 1fr;
			gap: 1.2rem;
			align-items: center;
			margin-bottom: 2rem;
			opacity: 0;
			transform: translateY(14px);
			animation: reveal 0.65s ease forwards;
		}

		.logo-badge {
			width: 120px;
			height: 120px;
			border-radius: 28px;
			box-shadow: var(--shadow);
			background:
				conic-gradient(from 160deg, var(--brand-a), var(--brand-b), var(--brand-c), var(--brand-a));
			position: relative;
			isolation: isolate;
			display: grid;
			place-items: center;
			overflow: hidden;
		}

		.logo-badge::before {
			content: "";
			position: absolute;
			inset: 2px;
			border-radius: 25px;
			background: linear-gradient(150deg, #f6fdff, #ebf8ff);
			z-index: -1;
		}

		.logo-text {
			font-family: "Archivo Black", sans-serif;
			font-size: 2rem;
			letter-spacing: 0.04em;
			color: #16313f;
		}

		.hero h1 {
			margin: 0;
			font-family: "Archivo Black", sans-serif;
			font-size: clamp(2rem, 4.2vw, 3.3rem);
			line-height: 1.03;
			letter-spacing: 0.01em;
		}

		.hero p {
			margin: 0.55rem 0 0;
			color: var(--muted);
			font-size: clamp(1rem, 2vw, 1.12rem);
			max-width: 60ch;
		}

		.profile-links {
			margin-top: 0.9rem;
			display: flex;
			flex-wrap: wrap;
			gap: 0.7rem;
		}

		.profile-link {
			display: inline-flex;
			align-items: center;
			gap: 0.45rem;
			padding: 0.5rem 0.85rem;
			border-radius: 999px;
			text-decoration: none;
			font-weight: 700;
			font-size: 0.92rem;
			color: #0f2a36;
			background: rgba(255, 255, 255, 0.86);
			border: 1px solid rgba(17, 42, 54, 0.16);
			transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
		}

		.profile-link:hover,
		.profile-link:focus-visible {
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(16, 34, 45, 0.12);
			border-color: rgba(17, 42, 54, 0.3);
			outline: none;
		}

		.cards {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1.2rem;
		}

		.card {
			background: var(--card);
			backdrop-filter: blur(5px);
			border: 1px solid var(--line);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			overflow: clip;
			text-decoration: none;
			color: inherit;
			opacity: 0;
			transform: translateY(18px) scale(0.98);
			transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
		}

		.card.revealed {
			opacity: 1;
			transform: translateY(0) scale(1);
			transition: opacity 0.45s ease, transform 0.45s ease;
		}

		.card:hover,
		.card:focus-visible {
			transform: translateY(-5px);
			box-shadow: 0 20px 36px rgba(16, 34, 45, 0.16);
			border-color: rgba(17, 42, 54, 0.24);
			outline: none;
		}

		.preview-shell {
			margin: 0;
			border-bottom: 1px solid var(--line);
			background: #f3f8fd;
			padding: 0.8rem;
			height: 235px;
			position: relative;
		}

		.preview-frame {
			width: 100%;
			height: 100%;
			border: 0;
			border-radius: 14px;
			background: white;
			box-shadow: inset 0 0 0 1px rgba(17, 42, 54, 0.08);
			pointer-events: none;
		}

		.card-content {
			padding: 1rem 1rem 1.1rem;
		}

		.card-title {
			margin: 0;
			font-family: "Archivo Black", sans-serif;
			font-size: 1.15rem;
			letter-spacing: 0.01em;
		}

		.card-url {
			margin: 0.45rem 0 0;
			color: var(--muted);
			font-size: 0.94rem;
			word-break: break-word;
		}

		.fallback-note {
			position: absolute;
			inset: auto 0.8rem 0.8rem;
			margin: 0;
			padding: 0.4rem 0.6rem;
			border-radius: 10px;
			font-size: 0.82rem;
			color: #2c4956;
			background: rgba(240, 248, 255, 0.92);
			border: 1px solid rgba(17, 42, 54, 0.14);
			display: none;
		}

		.preview-error .fallback-note {
			display: block;
		}

		@keyframes reveal {
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 850px) {
			.cards {
				grid-template-columns: 1fr;
			}
		}

		@media (max-width: 620px) {
			.hero {
				grid-template-columns: 1fr;
			}

			.logo-badge {
				width: 100px;
				height: 100px;
				border-radius: 24px;
			}

			.logo-text {
				font-size: 1.65rem;
			}

			.preview-shell {
				height: 205px;
			}
		}
	</style>
</head>
<body>
	<div class="noise-layer" aria-hidden="true"></div>

	<main class="page">
		<section class="hero" aria-label="Page intro">
			<div class="logo-badge" aria-hidden="true">
				<span class="logo-text">HB</span>
			</div>
			<div>
				<h1>Hoeleboele App Hub</h1>
				<p>Your projects in one place. Pick an app below to jump right in.</p>
				<div class="profile-links" aria-label="Profile links">
					<a class="profile-link" href="https://hoeleboel.itch.io" target="_blank" rel="noopener noreferrer">itch.io profile</a>
				</div>
			</div>
		</section>

		<section class="cards" aria-label="App links">
			<a class="card" href="https://hoeleboele.github.io/DNDCharacterTracker/" target="_blank" rel="noopener noreferrer" aria-label="Open DND Character Tracker">
				<figure class="preview-shell">
					<iframe class="preview-frame" loading="lazy" title="DND Character Tracker preview" src="https://hoeleboele.github.io/DNDCharacterTracker/"></iframe>
					<p class="fallback-note">Preview blocked by browser settings. Click card to open the app.</p>
				</figure>
				<div class="card-content">
					<h2 class="card-title">DND Character Tracker</h2>
					<p class="card-url">https://hoeleboele.github.io/DNDCharacterTracker/</p>
				</div>
			</a>

			<a class="card" href="https://hoeleboele.github.io/GOAInitTracker/" target="_blank" rel="noopener noreferrer" aria-label="Open GOA Init Tracker">
				<figure class="preview-shell">
					<iframe class="preview-frame" loading="lazy" title="GOA Init Tracker preview" src="https://hoeleboele.github.io/GOAInitTracker/"></iframe>
					<p class="fallback-note">Preview blocked by browser settings. Click card to open the app.</p>
				</figure>
				<div class="card-content">
					<h2 class="card-title">GOA Init Tracker</h2>
					<p class="card-url">https://hoeleboele.github.io/GOAInitTracker/</p>
				</div>
			</a>

		</section>
	</main>

	<script>
		const cards = document.querySelectorAll('.card');
		cards.forEach((card, index) => {
			setTimeout(() => {
				card.classList.add('revealed');
			}, 140 + index * 130);
		});

		// If preview cannot load due to frame policy, show a clear fallback note.
		document.querySelectorAll('.preview-frame').forEach((frame) => {
			const shell = frame.closest('.preview-shell');
			let loaded = false;

			frame.addEventListener('load', () => {
				loaded = true;
			});

			setTimeout(() => {
				if (!loaded && shell) {
					shell.classList.add('preview-error');
				}
			}, 3000);
		});
	</script>
</body>
</html>
