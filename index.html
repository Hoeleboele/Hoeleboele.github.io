<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hoeleboele | App Hub</title>
	<meta name="description" content="A central place for Hoeleboele apps and tools.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles/base.css">
	<link rel="stylesheet" href="styles/layout.css">
	<link rel="stylesheet" href="styles/components.css">
</head>
<body>
	<div class="noise-layer" aria-hidden="true"></div>
	<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
		<span class="theme-toggle-track" aria-hidden="true">
			<span class="theme-toggle-thumb"></span>
		</span>
		<span class="theme-toggle-icon" aria-hidden="true"></span>
		<span class="theme-toggle-label">Dark mode</span>
	</button>

	<main class="page">
		<section class="hero" aria-label="Page intro">
			<div class="logo-badge" aria-hidden="true">
				<img class="personal-logo" src="logos/Logo.png" alt="">
			</div>
			<div>
				<h1>Hoeleboele's App Hub</h1>
				<p>This page shows all my apps and tools. Explore the links below to access each app directly.</p>
				<div class="profile-links" aria-label="Profile links">
					<a class="profile-link" href="https://hoeleboele.itch.io" target="_blank" rel="noopener noreferrer">My itch profile</a>
				</div>
			</div>
		</section>

		<section id="app-cards" class="cards" aria-label="App links">
		</section>
	</main>
	<script type="module" src="scripts/main.js"></script>
</body>
</html>
